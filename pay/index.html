<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | Tony's Window Cleaning</title>
  <meta name="description" content="Your secure payment page for Tony's Window Cleaning, through QuickBooks." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#103050" />
  <meta property="og:title" content="Payment | Tony's Window Cleaning" />
  <meta property="og:description" content="Your secure payment page, through QuickBooks." />
  <link rel="icon" href="/assets/favicon.png" />
  <!-- The short payment link Tony texts (Oct 19, Tony: the link has to come from the business, short and easy to trust).
       The code goes to the pay function, which sends the customer on to that payment's own QuickBooks page.
       No tracking scripts on this page. -->
  <style>
    body{font:17px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;margin:0;padding:48px 20px;color:#0f1d2b;background:#f4f8fb;text-align:center}
    main{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 2px 12px rgba(15,29,43,.08)}
    img{width:56px;height:56px;border-radius:12px}
    h1{font-size:20px;margin:12px 0 8px}
    p{margin:0 0 10px;color:#3a4a5a}
    a{color:#103050;font-weight:600}
  </style>
</head>
<body>
  <main>
    <img src="/assets/favicon.png" alt="" />
    <h1 id="t">Opening your payment page</h1>
    <p id="m">One moment, you are going to your secure QuickBooks payment page.</p>
    <noscript><p>Please turn on JavaScript to open the payment page, or text Tony at (714) 559-0300 for help.</p></noscript>
  </main>
  <script>
    (function () {
      var TONY = 'text Tony at <a href="sms:+17145590300">(714) 559-0300</a>';
      var SAY = {
        missing: ['Link not found', 'Please check the link, or ' + TONY + '.'],
        paid: ['Paid, thank you', 'This payment is complete. Thank you for choosing Tony’s Window Cleaning.'],
        inactive: ['Link not active', 'This payment link is not active anymore. For a new one, ' + TONY + '.'],
        retry: ['Please try again', 'The payment page could not be opened just now. Please try again in a minute, or ' + TONY + '.']
      };
      function show(k) { var s = SAY[k] || SAY.retry; document.getElementById('t').textContent = s[0]; document.getElementById('m').innerHTML = s[1]; }
      var q = new URLSearchParams(location.search), c = (q.get('c') || location.hash.replace(/^#/, '')).trim();
      if (!/^[A-Za-z0-9]{10,16}$/.test(c)) return show('missing');
      fetch('https://srkzjhuwojfpnilvumid.supabase.co/functions/v1/pay?f=json&c=' + encodeURIComponent(c), { cache: 'no-store', referrerPolicy: 'no-referrer' })
        .then(function (r) { return r.json(); })
        .then(function (a) {
          // only ever on to QuickBooks
          if (a && a.state === 'active' && /^https:\/\/([a-z0-9-]+\.)*(intuit\.com|quickbooks\.com)\//i.test(a.go || '')) location.replace(a.go);
          else show(a && a.state);
        })
        .catch(function () { show('retry'); });
    })();
  </script>
</body>
</html>
